[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  CRM_REQUIRE_TURSO = "true"
  # These values are public configuration used in examples/defaults, not secrets.
  # Keep scanning passwords, session secrets, and API/database tokens.
  SECRETS_SCAN_OMIT_KEYS = "CRM_USERNAME,CRM_DB_PATH"

# Netlify automatically supplies its current Next.js/OpenNext adapter.
# Configure TURSO_DATABASE_URL, TURSO_AUTH_TOKEN and the CRM auth secrets
# in the Netlify UI with Functions runtime access; never put secrets here.
